<!DOCTYPE html>

<head>

<title>404 Not Found | Status Drop</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/styles.css">

<header class="bar">

    <a href="/" class="brand" aria-label="Status Drop home">

    <a class="btn" href="/">Play Status Drop</a>
    <a class="btn quiet" href="/#/codes/404">Read about 404</a>
  </div>

<footer class="foot">

    <nav class="foot-links" aria-label="Footer">
      <span class="foot-brand">Status Drop</span>
      <a href="/#/about">About</a>

  </div>
</footer>

</html>
